<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portal del colaborador · Cashless Colombia RRHH</title>
<meta name="theme-color" content="#1e3a75">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-96.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="login" class="login-wrap">
  <form class="login-card" id="loginForm">
    <img src="logo.png" alt="Cashless Colombia">
    <h2 class="center" style="margin:10px 0 2px">Portal del colaborador</h2>
    <p class="muted center" style="margin:0 0 18px">Ingrese con su cédula y contraseña</p>
    <div class="field"><label>Cédula</label><input id="lCed" inputmode="numeric" autocomplete="username" required></div>
    <div class="field"><label>Contraseña</label><input id="lPass" type="password" autocomplete="current-password" required><div class="hint">Si es su primer ingreso, su contraseña es su número de cédula. Podrá cambiarla en “Mi perfil”.</div></div>
    <div id="lErr" class="badge red hidden" style="margin-bottom:10px"></div>
    <button class="btn primary" style="width:100%;padding:12px">Ingresar</button>
    <div class="center small muted mt"><a href="index.html">Checador</a> · <a href="admin.html">Administración</a></div>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><img src="logo.png" alt=""><div><b id="brName">Cashless Colombia</b><span>Portal del colaborador</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><a class="btn" href="#" id="btnInstall">⬇ Instalar aplicación</a><a class="btn" href="#" id="btnOut">⏻ Cerrar sesión</a></div>
  </aside>
  <div class="main">
    <header class="topbar"><button class="icon-btn menu-btn" id="menuBtn">☰</button><b style="color:var(--navy);font-size:16px" id="pTitle">Inicio</b>
      <div class="top-actions"><div class="userchip"><div id="uAv"></div><span class="nm" id="uName"></span></div></div></header>
    <main class="content" id="view"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="core.js"></script>
<script src="docs.js"></script>
<script src="portal.js"></script>
<script>bootPortal();</script>
</body>
</html>
